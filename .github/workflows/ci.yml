name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Format / Clippy / Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Tests without handlers
        run: |
          cargo test --locked -p asset-io-core --no-default-features
          cargo test --locked -p asset-io --no-default-features

      - name: Test each handler independently
        run: |
          for handler in jpeg png bmff riff svg pdf c2pa; do
            cargo test --locked -p asset-io --no-default-features --features "$handler"
            cargo test --locked -p "asset-io-$handler"
          done

      - name: Tests (all features)
        run: cargo test --locked --workspace --all-features

  c-bindings:
    name: C bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting and lint
        run: |
          cargo fmt --manifest-path asset-io-c/Cargo.toml --check
          cargo clippy --locked --manifest-path asset-io-c/Cargo.toml --all-features --all-targets -- -D warnings

      - name: Test minimal, default and full bindings
        run: |
          cargo test --locked --manifest-path asset-io-c/Cargo.toml --no-default-features
          cargo test --locked --manifest-path asset-io-c/Cargo.toml
          cargo test --locked --manifest-path asset-io-c/Cargo.toml --all-features

      - name: Compile and run C and C++ consumers
        run: |
          cargo build --locked --manifest-path asset-io-c/Cargo.toml --all-features --target-dir asset-io-c/target
          cc -std=c11 -Wall -Wextra -Werror -Iasset-io-c/include asset-io-c/examples/smoke.c \
            -Lasset-io-c/target/debug -lasset_io_c -Wl,-rpath,"$PWD/asset-io-c/target/debug" -o asset-io-c/target/c-smoke
          asset-io-c/target/c-smoke
          c++ -x c++ -std=c++17 -Wall -Wextra -Werror -Iasset-io-c/include asset-io-c/examples/smoke.c \
            -Lasset-io-c/target/debug -lasset_io_c -Wl,-rpath,"$PWD/asset-io-c/target/debug" -o asset-io-c/target/cpp-smoke
          asset-io-c/target/cpp-smoke
