[workspace]
members = [
    ".",
    "crates/asset-io-core",
    "crates/asset-io-jpeg",
    "crates/asset-io-png",
    "crates/asset-io-bmff",
    "crates/asset-io-riff",
    "crates/asset-io-svg",
    "crates/asset-io-pdf",
    "crates/asset-io-tiff",
    "crates/asset-io-c2pa",
]
exclude = ["asset-io-c", "fuzz"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Gavin Peacock <gpeacock@adobe.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gpeacock/asset-io"

[workspace.dependencies]
asset-io-core = { path = "crates/asset-io-core", version = "0.2.0", default-features = false }
asset-io-jpeg = { path = "crates/asset-io-jpeg", version = "0.2.0", default-features = false }
asset-io-png = { path = "crates/asset-io-png", version = "0.2.0", default-features = false }
asset-io-bmff = { path = "crates/asset-io-bmff", version = "0.2.0", default-features = false }
asset-io-riff = { path = "crates/asset-io-riff", version = "0.2.0", default-features = false }
asset-io-svg = { path = "crates/asset-io-svg", version = "0.2.0", default-features = false }
asset-io-pdf = { path = "crates/asset-io-pdf", version = "0.2.0", default-features = false }
asset-io-tiff = { path = "crates/asset-io-tiff", version = "0.2.0", default-features = false }
asset-io-c2pa = { path = "crates/asset-io-c2pa", version = "0.2.0", default-features = false }

[package]
name = "asset-io"
version = "0.2.0"
edition = "2021"
authors = ["Gavin Peacock <gpeacock@adobe.com>"]
license = "MIT OR Apache-2.0"
description = "Streaming, container-agnostic access to media file structure and metadata (JUMBF, XMP)"
repository = "https://github.com/gpeacock/asset-io"
keywords = ["asset", "c2pa", "xmp", "jumbf", "metadata"]
categories = ["multimedia", "parsing"]
exclude = ["tests/", "fuzz/", "fuzz.sh", "FUZZING_SETUP.md", "Makefile"]

[dependencies]
asset-io-core.workspace = true
asset-io-jpeg = { workspace = true, optional = true }
asset-io-png = { workspace = true, optional = true }
asset-io-bmff = { workspace = true, optional = true }
asset-io-riff = { workspace = true, optional = true }
asset-io-svg = { workspace = true, optional = true }
asset-io-pdf = { workspace = true, optional = true }
asset-io-tiff = { workspace = true, optional = true }
asset-io-c2pa = { workspace = true, optional = true }

[dev-dependencies]
sha2 = "0.11"
tempfile = "3"
criterion = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }

[features]
default = []
jpeg = ["dep:asset-io-jpeg"]
png = ["dep:asset-io-png"]
bmff = ["dep:asset-io-bmff"]
riff = ["dep:asset-io-riff"]
svg = ["dep:asset-io-svg"]
pdf = ["dep:asset-io-pdf", "flate"]
tiff = ["dep:asset-io-tiff"]
c2pa = ["dep:asset-io-c2pa"]
# Transfer-encoding decoders: zlib, raw deflate and gzip; Brotli.
flate = ["asset-io-core/flate", "asset-io-png?/flate", "asset-io-bmff?/flate"]
brotli = ["asset-io-core/brotli", "asset-io-bmff?/brotli"]
exif = ["asset-io-core/exif", "asset-io-bmff?/exif"]
xmp = ["asset-io-core/xmp"]
memory-mapped = ["asset-io-core/memory-mapped", "asset-io-pdf?/memory-mapped"]
all-formats = ["jpeg", "png", "bmff", "riff", "svg", "pdf", "tiff", "c2pa"]

[[example]]
name = "inspect"
required-features = ["all-formats", "exif"]

[[example]]
name = "tokio_client"
required-features = ["all-formats"]

[[bench]]
name = "io"
harness = false
required-features = ["all-formats"]

[profile.bench]
inherits = "release"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
