[package]
name = "asset-io"
version = "0.2.0"
edition = "2021"
authors = ["Gavin Peacock <gpeacock@adobe.com>"]
license = "MIT OR Apache-2.0"
description = "Streaming, container-agnostic access to media file structure and metadata (JUMBF, XMP)"
repository = "https://github.com/gpeacock/asset-io"
keywords = ["asset", "c2pa", "xmp", "jumbf", "metadata"]
categories = ["multimedia", "parsing"]
exclude = ["tests/", "fuzz/", "fuzz.sh", "FUZZING_SETUP.md", "Makefile"]

[dependencies]
thiserror = "1.0"

md5 = { version = "0.7", optional = true }
memchr = { version = "2", optional = true }
quick-xml = { version = "0.38", optional = true, default-features = false }
memmap2 = { version = "0.9", optional = true }
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }

[dev-dependencies]
sha2 = "0.11"
tempfile = "3"
criterion = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }

[features]
default = ["jpeg", "png"]
jpeg = ["md5", "memchr"]
png = []
bmff = []
riff = []
svg = ["quick-xml"]
pdf = ["dep:flate2"]
exif = []
xmp = ["quick-xml", "md5"]
memory-mapped = ["memmap2"]
all-formats = ["jpeg", "png", "bmff", "riff", "svg", "pdf"]

[[example]]
name = "inspect"
required-features = ["all-formats", "xmp", "exif"]

[[example]]
name = "tokio_client"
required-features = ["all-formats"]

[[bench]]
name = "io"
harness = false
required-features = ["all-formats"]

[profile.bench]
inherits = "release"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
